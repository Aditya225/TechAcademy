.mobile-toggle {
  display: none;

  width: 100%;
  height: 3px;

  border-radius: 2px;
  transition: all 0.3s ease;
}

.mobile-toggle.active span:nth-child(1) {
  transform: translateY(9px) rotate(45deg);
}

  opacity: 0;
